name: arcadiaplus
description: "A modern cross-platform proxy client built with Flutter and Rust."
publish_to: "none"

version: 1.1.1+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0 <3.48.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0
  rust_lib_arcadiaplus:
    path: rust_builder
  flutter_rust_bridge: 2.13.0

  material_design_icons_flutter: ^7.0.7296
  dynamic_color: ^1.9.0
  arcadia_expressive:
    path: packages/arcadia_expressive
  material_new_shapes: ^1.0.0

  # State management
  provider: ^6.1.5

  go_router: ^18.1.4

  intl: ^0.20.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0

  http: ^1.6.0
  dio: ^5.11.1
  crypto: ^3.0.6

  # YAML parsing
  yaml: ^3.1.4

  # Charts and data visualization
  fl_chart: ^1.3.1

  # Animations
  flutter_animate: ^4.5.2

  # File operations
  file_picker: ^13.4.0

  # 0.6 moved the window API onto nativeapi, whose C++ core ships through a
  # native-asset hook: on Linux it needs GTK 3 / X11 / Xi just to run
  # `flutter test`, and it packages a desktop windowing library into the Android
  # APK (measured: 2.26 MB arm64, 1.81 MB armeabi-v7a, 2.17 MB x86_64) for three
  # calls this app only makes on desktop. 0.7 additionally needs Dart 3.14. This
  # stays on the plugin line until the toolchain moves and the mobile payload
  # question has an answer.
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  ffigen: ^23.0.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: false
  ios: true
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
  linux: true
  web:
    generate: true
    image_path: "assets/AcadiaPlusLight.jpg"
    background_color: "#00143D"
    theme_color: "#0057D9"
  image_path: "assets/AcadiaPlusLight.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/AcadiaPlusLight.jpg
    - assets/AcadiaPlusDark.jpg
    - assets/Country.mmdb
    - assets/fonts/LICENSE-Roboto.txt
    - assets/fonts/LICENSE-GoogleSansFlex.txt
    - assets/fonts/LICENSE-NotoSansSC.txt
    - assets/fonts/LICENSE-GoogleSansCode.txt
    - assets/wintun/wintun.dll
    - assets/wintun/LICENSE.txt
    - LICENSE

  fonts:
    - family: Google Sans Code
      fonts:
        - asset: assets/fonts/GoogleSansCode.ttf
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
