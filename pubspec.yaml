name: arcadiaplus
description: "A modern cross-platform proxy client built with Flutter and Rust."
publish_to: 'none'

version: 1.0.5+2

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0 <3.48.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  rust_lib_arcadiaplus:
    path: rust_builder
  flutter_rust_bridge: 2.13.0

  # Material Design 3 and UI components
  material_design_icons_flutter: ^7.0.7296
  dynamic_color: ^1.9.0

  # State management
  provider: ^6.1.5

  go_router: ^17.5.0

  intl: ^0.20.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0

  http: ^1.4.0
  dio: ^5.11.1
  crypto: ^3.0.6

  # YAML parsing
  yaml: ^3.1.4

  # Charts and data visualization
  fl_chart: ^1.1.1

  # Animations
  flutter_animate: ^4.5.2

  # File operations
  file_picker: ^12.3.0

  # Platform specific - Desktop window management
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  ffigen: ^21.0.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
  linux: true
  web:
    generate: true
    image_path: "assets/arcadiaplus.png"
    background_color: "#00143D"
    theme_color: "#0057D9"
  image_path: "assets/arcadiaplus.png"
  adaptive_icon_background: "#00143D"
  adaptive_icon_foreground: "assets/arcadiaplus.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  
  assets:
    - assets/arcadiaplus.png
    - assets/Country.mmdb
    - assets/fonts/LICENSE-Roboto.txt
    - assets/wintun/wintun.dll
    - assets/wintun/LICENSE.txt
    - LICENSE

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
