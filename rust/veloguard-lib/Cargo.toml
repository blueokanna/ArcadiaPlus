[package]
name = "veloguard-lib"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "VeloGuard ⇄ corduit FFI bridge for Flutter (flutter_rust_bridge)"

[lib]
# The Flutter build chain loads this artifact by name
# (`System.loadLibrary("rust_lib_veloguard")` on Android, the same stem
# in the Xcode / CMake / Cargokit wiring). Renaming it would break every
# platform target, so the stem is intentionally kept stable.
name = "rust_lib_veloguard"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
corduit = { workspace = true }
flutter_rust_bridge = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
recurse-x = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }
tracing-android = "0.2"
