[package]
name = "lib-arcadiaplus"
edition = "2021"
license-file = "../LICENSE"
version = "1.0.5"
authors = ["blueokanna"]
description = "A cross-platform basic proxy client rust core for ArcadiaPlus"
homepage = "https://github.com/blueokanna/ArcadiaPlus"

[lib]
name = "rust_lib_arcadiaplus"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
corduit = { version = "0.2.2", features = ["hysteria2", "reality", "tuic"] }
flutter_rust_bridge = "=2.13.0"
once_cell = "1.21.4"
parking_lot = "0.12"
recurse-x = { version = "0.2.1" }
tokio = { version = "1.53.1", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
tracing-android = "0.2"

[profile.dev]
debug = "line-tables-only"
