[workspace]
resolver = "3"
members = ["veloguard-lib"]

[workspace.package]
edition = "2021"
license-file = "../LICENSE"
version = "1.0.2"
authors = ["blueokanna"]
description = "Cross-platform proxy client core for VeloGuard"

[workspace.dependencies]
corduit = { version = "0.1.5", features = ["hysteria2", "reality", "tuic"] }
flutter_rust_bridge = "=2.13.0"
jni = "0.21"
once_cell = "1.21.4"
parking_lot = "0.12"
recurse-x = "0.1.0"
tokio = { version = "1.53.1", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "registry",
] }
