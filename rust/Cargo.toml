[package]
name = "veloguard"
version = "1.0.2"
edition = "2024"
rust-version = "1.88"
authors = ["blueokanna"]
description = "VeloGuard core engine: single-crate proxy runtime, DNS, netstack and wire protocols"
homepage = "https://github.com/blueokanna/VeloGuard"
repository = "https://github.com/blueokanna/VeloGuard"
license-file = "../LICENSE"
publish = false

[lib]
name = "rust_lib_veloguard"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["tls", "wireguard"]
tls = []
wireguard = []
jaeger = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]

[dependencies]
nextjson = { version = "0.1.4", default-features = false, features = [
    "std",
    "derive",
] }
tzcraft = { version = "0.1.2", default-features = false, features = ["std"] }
corduit = { version = "0.1.4", default-features = false, features = [
    "std",
    "tls",
    "wireguard",
] }
courierust = { version = "1.0.4", default-features = false, features = ["std"] }
recurse-x = { version = "0.1.0", default-features = false, features = [
    "std",
    "dot",
    "doh",
] }

# -- async runtime / concurrency --------------------------------------------
async-trait = "0.1.92"
dashmap = "6.2.1"
futures = "0.3.34"
once_cell = "1.21.4"
parking_lot = "0.12"
pin-project-lite = "0.2.17"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["net", "codec", "io", "compat"] }

# -- cryptography -------------------------------------------------------------
getrandom = { version = "0.4.3", features = ["std"] }

# -- TLS ---------------------------------------------------------------------
# TCP TLS (DoH/DoT servers and clients, VMess-over-TLS) still runs on rustls.
# QUIC is corduit's own TLS 1.3-over-QUIC implementation, so no quinn.
rustls = { version = "0.23.44", default-features = false, features = [
    "std",
    "ring",
] }
rustls-native-certs = "0.8.4"
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
] }
webpki-roots = "1.0.9"

# -- networking / netstack ---------------------------------------------------
ipnet = "2.12.1"
lru = "0.18.2"
smoltcp = { version = "0.13.1", default-features = false, features = [
    "std",
    "log",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-udp",
    "socket-tcp",
] }
socket2 = { version = "0.6.5", features = ["all"] }

# -- DNS ---------------------------------------------------------------------
hickory-proto = { version = "0.26.1", default-features = false }

# -- config / data -----------------------------------------------------------
bytes = "1.12.1"
maxminddb = "0.31.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
url = "2.5.8"
uuid = { version = "1.26.1", features = [
    "v4",
    "fast-rng",
    "macro-diagnostics",
    "serde",
] }

# -- platform / observability ------------------------------------------------
bitflags = "2.13.2"
flutter_rust_bridge = "=2.12.0"
libc = "0.2"
sysinfo = "0.39.6"
thiserror = "2.0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "local-time",
] }

# -- optional OpenTelemetry --------------------------------------------------
opentelemetry = { version = "0.32.0", optional = true }
opentelemetry-otlp = { version = "0.32.0", features = [
    "grpc-tonic",
], optional = true }
opentelemetry_sdk = { version = "0.32.1", features = [
    "rt-tokio",
], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }

[target.'cfg(unix)'.dependencies]
tun-rs = { version = "=2.5.7", features = ["async", "async_framed"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
tracing-android = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_Rras",
    "Win32_Networking_WinSock",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
wintun-bindings = { version = "0.7.39", features = ["async"] }
zip = "8.6.0"

[dev-dependencies]
proptest = "1.11"
tokio-test = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.bench]
lto = "thin"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
