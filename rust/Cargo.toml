[package]
name = "lib-arcadiaplus"
edition = "2024"
license-file = "../LICENSE"
version = "1.0.8"
rust-version = "1.88"
authors = ["blueokanna"]
description = "A cross-platform basic proxy client with rust core and flutter bindings for ArcadiaPlus"
homepage = "https://github.com/blueokanna/ArcadiaPlus"

[lib]
name = "rust_lib_arcadiaplus"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
corduit = { version = "0.3.1", features = [
    "std",
    "tls",
    "tls13",
    "quic",
    "hysteria",
    "hysteria2",
    "reality",
    "shadowtls",
    "tuic",
    "wireguard",
] }
flutter_rust_bridge = { version = "=2.13.0", default-features = false, features = [
    "anyhow",
    "dart-opaque",
    "log",
    "portable-atomic",
    "rust-async",
    "thread-pool",
    "wasm-start",
] }
once_cell = "1.21.4"
parking_lot = "0.12.5"
recurse-x = { version = "0.2.4" }
tokio = { version = "1.54.1", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
tracing-android = "0.2"

[profile.dev]
debug = "line-tables-only"
