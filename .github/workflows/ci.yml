name: Continuous Integration

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze, test, and Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 'false'
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Check out the proxy engine the bridge points at
        uses: ./.github/actions/checkout-engine

      - name: Reclaim disk space this build does not need
        run: |
          set -euo pipefail
          echo "free before: $(df -h / | awk 'NR==2 {print $4}')"
          # The runner image ships toolchains and payloads this job never
          # touches. The pinned NDK is installed explicitly further down, so the
          # preinstalled releases are dead weight on a build that fills the
          # disk.
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/android/sdk/ndk
          echo "free after:  $(df -h / | awk 'NR==2 {print $4}')"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
          targets: armv7-linux-androideabi,aarch64-linux-android,i686-linux-android,x86_64-linux-android

      - name: Install the Android NDK recorded in build.gradle.kts
        shell: bash
        run: |
          set -euo pipefail
          # `ndkVersion` in the app module is pinned so every build links with
          # exactly the NDK the project was tested against; the runner image
          # does not ship that release, so install it before Gradle runs.
          ndk="$(sed -nE 's/^ *ndkVersion = "([^"]+)"$/\1/p' android/app/build.gradle.kts | head -n1)"
          if [[ -z "$ndk" ]]; then
            echo "No ndkVersion pin found; using the runner default" >&2
            exit 0
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk"
          echo "Installed NDK $ndk"

      - name: Use the pub host recorded in pubspec.lock
        shell: bash
        run: |
          set -euo pipefail
          # `pubspec.lock` records the host that produced it; resolving against a
          # different host makes `--enforce-lockfile` report every package as
          # changed. Follow the lockfile instead of hard-coding a mirror.
          host="$(sed -nE 's|^ *url: *"(https?://[^"]+)"$|\1|p' pubspec.lock | head -n1)"
          if [[ -n "$host" ]]; then
            echo "PUB_HOSTED_URL=$host" >> "$GITHUB_ENV"
            echo "Using the pub host from pubspec.lock: $host"
          else
            echo "Using the default pub host (pub.dev)"
          fi

      - name: Resolve locked Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Give the Android build a CI-sized Gradle heap
        shell: bash
        run: |
          set -euo pipefail
          # android/gradle.properties caps the daemon at -Xmx1G, which is a
          # local-machine setting. The four-ABI debug package does not fit in
          # that heap on a runner this size: the last green CI run (054163a)
          # used 4G, and every run since the cap was lowered fails in
          # :app:packageDebug. Raise it for CI only, so the committed cap still
          # governs local builds.
          sed -i 's|^org\.gradle\.jvmargs=.*|org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m|' android/gradle.properties
          grep '^org.gradle.jvmargs' android/gradle.properties

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Report why the Android build failed
        if: failure()
        run: |
          set -euo pipefail
          echo '--- disk (bytes) ---'; df -h /
          echo '--- disk (inodes) ---'; df -i /
          echo '--- memory ---'; free -m
          echo '--- top-level footprint ---'
          du -sh .[!.]* * 2>/dev/null | sort -h | tail -n 20 || true
          echo '--- gradle daemon log (the task failure with its cause) ---'
          tail -n 150 "$HOME"/.gradle/daemon/*/daemon-*.out.log 2>/dev/null ||
            echo 'no daemon log found'

      - name: Make the Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Lint Android release
        working-directory: android
        run: |
          set -euo pipefail
          # `lintRelease` without a project prefix resolves in *every* Gradle
          # project that has such a task, which includes each Flutter plugin
          # checked out under the pub cache. Their lint tasks fail on their own
          # sources (e.g. `shared_preferences_android` trips
          # `MemberExtensionConflict` on AGP 8.14), and a third-party plugin is
          # not ours to fix. Lint this app module only.
          ./gradlew :app:lintRelease

  rust:
    name: Rust format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Check out the proxy engine the bridge points at
        uses: ./.github/actions/checkout-engine

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
          components: rustfmt,clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --all-targets --all-features --locked

  ohos:
    name: HarmonyOS release HAP (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Check out the proxy engine the bridge points at
        uses: ./.github/actions/checkout-engine

      - name: Reclaim disk space this build does not need
        run: |
          set -euo pipefail
          echo "free before: $(df -h / | awk 'NR==2 {print $4}')"
          # See the flutter job: the pinned NDK is installed explicitly, so the
          # preinstalled releases are dead weight on a build that fills the disk.
          # The HarmonyOS toolchain itself adds ~6 GB on top.
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/android/sdk/ndk
          echo "free after:  $(df -h / | awk 'NR==2 {print $4}')"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'

      - name: Restore the HarmonyOS toolchain downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ohos-downloads
          key: ohos-downloads-v1-${{ runner.os }}-clt5.1.0.840-sdk50bf4602

      - name: Set up the HarmonyOS toolchain
        uses: ./.github/actions/setup-ohos

      - name: Check out the Flutter OHOS SDK
        uses: ./.github/actions/checkout-flutter-ohos

      - name: Prepare the OHOS build
        uses: ./.github/actions/prepare-ohos-build

      - name: Build the Rust engine for HarmonyOS arm64
        run: bash ohos/scripts/build-rust-ohos.sh

      - name: Build the release HAP
        run: flutter build hap --release --no-codesign

      - name: Verify the HAP carries the Flutter runtime and the bridge
        shell: bash
        run: |
          set -euo pipefail
          hap="$(find ohos/entry/build -name 'entry-default-unsigned.hap' -print -quit)"
          if [[ -z "$hap" ]]; then
            echo "::error title=No HAP produced::flutter build hap left no entry-default-unsigned.hap behind"
            find ohos/entry/build -name '*.hap' -print
            exit 1
          fi
          echo "HAP: $hap ($(du -h "$hap" | cut -f1))"
          listing="$(unzip -l "$hap")"
          for required in \
            libs/arm64-v8a/libapp.so \
            libs/arm64-v8a/librust_lib_arcadiaplus.so \
            libs/arm64-v8a/libarcadia_core.so; do
            if ! grep -qF "$required" <<< "$listing"; then
              echo "::error title=Incomplete HAP::$required is not packaged in $hap"
              printf '%s\n' "$listing" | head -n 60
              exit 1
            fi
            echo "packaged: $required"
          done

      - name: Stage the HAP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$(find ohos/entry/build -name 'entry-default-unsigned.hap' -print -quit)" \
             dist/ArcadiaPlus-ci-ohos-arm64-unsigned.hap
          ls -lh dist

      - name: Upload the HAP
        uses: actions/upload-artifact@v4
        with:
          name: ohos
          path: dist/*
          if-no-files-found: error
