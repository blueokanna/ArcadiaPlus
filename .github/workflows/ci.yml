name: Continuous Integration

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze, test, and Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
          targets: armv7-linux-androideabi,aarch64-linux-android,i686-linux-android,x86_64-linux-android

      - name: Use the pub host recorded in pubspec.lock
        shell: bash
        run: |
          set -euo pipefail
          # `pubspec.lock` records the host that produced it; resolving against a
          # different host makes `--enforce-lockfile` report every package as
          # changed. Follow the lockfile instead of hard-coding a mirror.
          host="$(sed -nE 's|^ *url: *"(https?://[^"]+)"$|\1|p' pubspec.lock | head -n1)"
          if [[ -n "$host" ]]; then
            echo "PUB_HOSTED_URL=$host" >> "$GITHUB_ENV"
            echo "Using the pub host from pubspec.lock: $host"
          else
            echo "Using the default pub host (pub.dev)"
          fi

      - name: Resolve locked Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Make the Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Lint Android release
        working-directory: android
        run: ./gradlew lintRelease

  rust:
    name: Rust format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
          components: rustfmt,clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --all-targets --all-features --locked
