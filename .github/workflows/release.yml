name: Stable Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stable-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  android:
    name: Build and publish Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve and validate stable release
        id: release
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9]+)?$/\1/p' pubspec.yaml)"
          test -n "$version"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "Manual releases must run from the default branch '$DEFAULT_BRANCH'" >&2
              exit 1
            fi
            tag="v$version"
          else
            tag="$GITHUB_REF_NAME"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable vMAJOR.MINOR.PATCH tags can be released" >&2
            exit 1
          fi
          test "$tag" = "v$version"

          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            test "$(git rev-list -n 1 "$tag")" = "$(git rev-parse HEAD)" || {
              echo "Tag '$tag' already points to a different commit" >&2
              exit 1
            }
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release '$tag' already exists and published assets are immutable" >&2
            exit 1
          fi

          awk -v version="$version" '
            $0 == "## " version { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > changelog-section.md
          grep -qE '^- ' changelog-section.md
          {
            echo '**Official changelog:**'
            echo
            cat changelog-section.md
          } > release-notes.md

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
          components: rustfmt,clippy
          targets: armv7-linux-androideabi,aarch64-linux-android,i686-linux-android,x86_64-linux-android

      - name: Install the Android NDK recorded in build.gradle.kts
        shell: bash
        run: |
          set -euo pipefail
          # `ndkVersion` in the app module is pinned so every build links with
          # exactly the NDK the project was tested against; the runner image
          # does not ship that release, so install it before Gradle runs.
          ndk="$(sed -nE 's/^ *ndkVersion = "([^"]+)"$/\1/p' android/app/build.gradle.kts | head -n1)"
          if [[ -z "$ndk" ]]; then
            echo "No ndkVersion pin found; using the runner default" >&2
            exit 0
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk"
          echo "Installed NDK $ndk"

      - name: Use the pub host recorded in pubspec.lock
        shell: bash
        run: |
          set -euo pipefail
          # `pubspec.lock` records the host that produced it; resolving against a
          # different host makes `--enforce-lockfile` report every package as
          # changed. Follow the lockfile instead of hard-coding a mirror.
          host="$(sed -nE 's|^ *url: *"(https?://[^"]+)"$|\1|p' pubspec.lock | head -n1)"
          if [[ -n "$host" ]]; then
            echo "PUB_HOSTED_URL=$host" >> "$GITHUB_ENV"
            echo "Using the pub host from pubspec.lock: $host"
          else
            echo "Using the default pub host (pub.dev)"
          fi

      - name: Resolve dependencies and test
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --all-features --locked

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Make the Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Lint Android release
        working-directory: android
        run: |
          set -euo pipefail
          # Scope lint to this app module: a bare `lintRelease` also runs the
          # lint task of every Flutter plugin checked out under the pub cache,
          # and those third-party sources are not ours to fix.
          ./gradlew :app:lintRelease

      - name: Create checksum-verified update metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          asset="VeloGuard-${RELEASE_TAG}-android-debug.apk"
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/$asset"
          checksum="$(sha256sum "dist/$asset" | cut -d' ' -f1)"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${asset}"
          jq -e -n \
            --arg tag "$RELEASE_TAG" \
            --arg version "$RELEASE_VERSION" \
            --arg published_at "$published_at" \
            --arg name "$asset" \
            --arg url "$url" \
            --arg sha256 "$checksum" \
            '{schema:1,tag:$tag,version:$version,published_at:$published_at,assets:[{platform:"android",name:$name,url:$url,sha256:$sha256}]}' \
            > dist/update-manifest.json
          (cd dist && sha256sum "$asset" update-manifest.json > SHA256SUMS)

      - name: Publish stable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: VeloGuard ${{ steps.release.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/VeloGuard-${{ steps.release.outputs.tag }}-android-debug.apk
            dist/update-manifest.json
            dist/SHA256SUMS
