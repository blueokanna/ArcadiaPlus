name: Stable Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stable-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release identity and notes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve and validate stable release
        id: release
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9]+)?$/\1/p' pubspec.yaml)"
          if [[ -z "$version" ]]; then
            echo "pubspec.yaml does not declare a stable MAJOR.MINOR.PATCH version" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "Manual releases must run from the default branch '$DEFAULT_BRANCH'" >&2
              exit 1
            fi
            tag="v$version"
          else
            tag="$GITHUB_REF_NAME"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable vMAJOR.MINOR.PATCH tags can be released" >&2
            exit 1
          fi
          if [[ "$tag" != "v$version" ]]; then
            echo "Tag '$tag' does not match the pubspec version 'v$version': bump pubspec.yaml, commit it, and re-tag" >&2
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            test "$(git rev-list -n 1 "$tag")" = "$(git rev-parse HEAD)" || {
              echo "Tag '$tag' already points to a different commit" >&2
              exit 1
            }
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release '$tag' already exists and published assets are immutable" >&2
            exit 1
          fi

          # The pubspec carries a Flutter build suffix (`1.0.5+2`): match the
          # changelog section with or without it, so a `## 1.0.5+2` heading can
          # hold the notes for tag v1.0.5. The dots are bracketed so they match
          # literally instead of as "any character".
          ver_esc="${version//./[.]}"
          awk -v version="$ver_esc" '
            { sub(/\r$/, "") }
            found == 0 && $0 ~ ("^## " version "([+][0-9]+)?$") { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > changelog-section.md
          if ! grep -qE '^- ' changelog-section.md; then
            echo "CHANGELOG.md has no entries under '## $version'; write the release notes before tagging" >&2
            exit 1
          fi
          {
            echo '**Official changelog:**'
            echo
            cat changelog-section.md
          } > release-notes.md

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload the release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  quality:
    name: Dart, Flutter, and Rust quality gates
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5

      - name: Check out the proxy engine the bridge points at
        uses: ./.github/actions/checkout-engine
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
          components: rustfmt,clippy

      - name: Use the pub host recorded in pubspec.lock
        shell: bash
        run: |
          set -euo pipefail
          # `pubspec.lock` records the host that produced it; resolving against a
          # different host makes `--enforce-lockfile` report every package as
          # changed. Follow the lockfile instead of hard-coding a mirror.
          host="$(sed -nE 's|^ *url: *"(https?://[^"]+)"$|\1|p' pubspec.lock | head -n1)"
          if [[ -n "$host" ]]; then
            echo "PUB_HOSTED_URL=$host" >> "$GITHUB_ENV"
            echo "Using the pub host from pubspec.lock: $host"
          else
            echo "Using the default pub host (pub.dev)"
          fi

      - name: Resolve dependencies and test
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --all-features --locked

  android:
    name: Android debug and release APKs
    needs: [validate, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: 'false'
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5

      - name: Check out the proxy engine the bridge points at
        uses: ./.github/actions/checkout-engine

      - name: Reclaim disk space this build does not need
        run: |
          set -euo pipefail
          echo "free before: $(df -h / | awk 'NR==2 {print $4}')"
          # See ci.yml: the pinned NDK is installed explicitly further down, so
          # the preinstalled releases are dead weight here.
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/android/sdk/ndk
          echo "free after:  $(df -h / | awk 'NR==2 {print $4}')"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
          targets: armv7-linux-androideabi,aarch64-linux-android,i686-linux-android,x86_64-linux-android

      - name: Install the Android NDK recorded in build.gradle.kts
        shell: bash
        run: |
          set -euo pipefail
          # `ndkVersion` in the app module is pinned so every build links with
          # exactly the NDK the project was tested against; the runner image
          # does not ship that release, so install it before Gradle runs.
          ndk="$(sed -nE 's/^ *ndkVersion = "([^"]+)"$/\1/p' android/app/build.gradle.kts | head -n1)"
          if [[ -z "$ndk" ]]; then
            echo "No ndkVersion pin found; using the runner default" >&2
            exit 0
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk"
          echo "Installed NDK $ndk"

      - name: Use the pub host recorded in pubspec.lock
        shell: bash
        run: |
          set -euo pipefail
          # `pubspec.lock` records the host that produced it; resolving against a
          # different host makes `--enforce-lockfile` report every package as
          # changed. Follow the lockfile instead of hard-coding a mirror.
          host="$(sed -nE 's|^ *url: *"(https?://[^"]+)"$|\1|p' pubspec.lock | head -n1)"
          if [[ -n "$host" ]]; then
            echo "PUB_HOSTED_URL=$host" >> "$GITHUB_ENV"
            echo "Using the pub host from pubspec.lock: $host"
          else
            echo "Using the default pub host (pub.dev)"
          fi

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Decode the Android release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ARCADIAPLUS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ARCADIAPLUS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARCADIAPLUS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ARCADIAPLUS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning title=Unsigned release APK::ARCADIAPLUS_KEYSTORE_BASE64 is not configured, so the release APK is signed with the debug key and can only upgrade installs that the debug key signed."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "ARCADIAPLUS_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "ARCADIAPLUS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ARCADIAPLUS_KEY_ALIAS=$KEY_ALIAS"
            echo "ARCADIAPLUS_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Give the Android build a CI-sized Gradle heap
        shell: bash
        run: |
          set -euo pipefail
          # See ci.yml: the committed -Xmx1G cap is a local-machine setting, and
          # the four-ABI packages do not fit in it on a runner.
          sed -i 's|^org\.gradle\.jvmargs=.*|org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m|' android/gradle.properties
          grep '^org.gradle.jvmargs' android/gradle.properties

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Report why the Android build failed
        if: failure()
        run: |
          set -euo pipefail
          echo '--- disk (bytes) ---'; df -h /
          echo '--- disk (inodes) ---'; df -i /
          echo '--- memory ---'; free -m
          echo '--- top-level footprint ---'
          du -sh .[!.]* * 2>/dev/null | sort -h | tail -n 20 || true
          echo '--- gradle daemon log (the task failure with its cause) ---'
          tail -n 150 "$HOME"/.gradle/daemon/*/daemon-*.out.log 2>/dev/null ||
            echo 'no daemon log found'

      - name: Make the Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Lint Android release
        working-directory: android
        run: |
          set -euo pipefail
          # Scope lint to this app module: a bare `lintRelease` also runs the
          # lint task of every Flutter plugin checked out under the pub cache,
          # and those third-party sources are not ours to fix.
          ./gradlew :app:lintRelease

      - name: Stage the APKs
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.validate.outputs.tag }}'
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/ArcadiaPlus-${tag}-android-debug.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/ArcadiaPlus-${tag}-android-release.apk"
          ls -lh dist

      - name: Upload the Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows installer and portable archive
    needs: [validate, quality]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5

      - name: Check out the proxy engine the bridge points at
        uses: ./.github/actions/checkout-engine

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'

      - name: Use the pub host recorded in pubspec.lock
        shell: bash
        run: |
          set -euo pipefail
          # `pubspec.lock` records the host that produced it; resolving against a
          # different host makes `--enforce-lockfile` report every package as
          # changed. Follow the lockfile instead of hard-coding a mirror.
          host="$(sed -nE 's|^ *url: *"(https?://[^"]+)"$|\1|p' pubspec.lock | head -n1)"
          if [[ -n "$host" ]]; then
            echo "PUB_HOSTED_URL=$host" >> "$GITHUB_ENV"
            echo "Using the pub host from pubspec.lock: $host"
          else
            echo "Using the default pub host (pub.dev)"
          fi

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build the Windows release bundle
        run: flutter build windows --release

      - name: Stage the portable archive
        shell: pwsh
        run: |
          $tag = '${{ needs.validate.outputs.tag }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          tar -a -c -f "dist/ArcadiaPlus-$tag-windows-x64-portable.zip" -C 'build\windows\x64\runner\Release' .

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          $tag = '${{ needs.validate.outputs.tag }}'
          $version = '${{ needs.validate.outputs.version }}'
          $iss = @"
          [Setup]
          AppId={{E4BD9BC7-9DC9-469E-9F38-BA84DB86AC22}
          AppName=ArcadiaPlus
          AppVersion=$version
          AppVerName=ArcadiaPlus $version
          AppPublisher=blueokanna
          AppPublisherURL=https://github.com/blueokanna/ArcadiaPlus
          AppSupportURL=https://github.com/blueokanna/ArcadiaPlus/issues
          AppUpdatesURL=https://github.com/blueokanna/ArcadiaPlus/releases
          DefaultDirName={autopf}\ArcadiaPlus
          DefaultGroupName=ArcadiaPlus
          DisableProgramGroupPage=yes
          UninstallDisplayIcon={app}\arcadiaplus.exe
          OutputDir=$($PWD.Path)\dist
          OutputBaseFilename=ArcadiaPlus-$tag-windows-x64-setup
          Compression=lzma2/max
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=lowest
          PrivilegesRequiredOverridesAllowed=dialog
          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"
          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked
          [Files]
          Source: "$($PWD.Path)\build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\ArcadiaPlus"; Filename: "{app}\arcadiaplus.exe"
          Name: "{autodesktop}\ArcadiaPlus"; Filename: "{app}\arcadiaplus.exe"; Tasks: desktopicon
          [Run]
          Filename: "{app}\arcadiaplus.exe"; Description: "{cm:LaunchProgram,ArcadiaPlus}"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path "$env:RUNNER_TEMP\arcadiaplus.iss" -Value $iss -Encoding utf8
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "$env:RUNNER_TEMP\arcadiaplus.iss"
          Get-ChildItem dist

      - name: Upload the Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS disk image and archive
    needs: [validate, quality]
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5

      - name: Check out the proxy engine the bridge points at
        uses: ./.github/actions/checkout-engine

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Set up Rust for both macOS architectures
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Use the pub host recorded in pubspec.lock
        shell: bash
        run: |
          set -euo pipefail
          # `pubspec.lock` records the host that produced it; resolving against a
          # different host makes `--enforce-lockfile` report every package as
          # changed. Follow the lockfile instead of hard-coding a mirror.
          host="$(sed -nE 's|^ *url: *"(https?://[^"]+)"$|\1|p' pubspec.lock | head -n1)"
          if [[ -n "$host" ]]; then
            echo "PUB_HOSTED_URL=$host" >> "$GITHUB_ENV"
            echo "Using the pub host from pubspec.lock: $host"
          else
            echo "Using the default pub host (pub.dev)"
          fi

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build the macOS release bundle
        run: flutter build macos --release

      - name: Stage the disk image and the archive
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.validate.outputs.tag }}'
          version='${{ needs.validate.outputs.version }}'
          app='build/macos/Build/Products/Release/ArcadiaPlus.app'
          test -d "$app"
          mkdir -p dist
          hdiutil create -volname "ArcadiaPlus $version" -srcfolder "$app" -ov -format UDZO "dist/ArcadiaPlus-${tag}-macos-universal.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/ArcadiaPlus-${tag}-macos-universal.zip"
          ls -lh dist

      - name: Upload the macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux bundle, Debian package, and tarball
    needs: [validate, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5

      - name: Check out the proxy engine the bridge points at
        uses: ./.github/actions/checkout-engine

      - name: Install the Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev g++

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'

      - name: Use the pub host recorded in pubspec.lock
        shell: bash
        run: |
          set -euo pipefail
          # `pubspec.lock` records the host that produced it; resolving against a
          # different host makes `--enforce-lockfile` report every package as
          # changed. Follow the lockfile instead of hard-coding a mirror.
          host="$(sed -nE 's|^ *url: *"(https?://[^"]+)"$|\1|p' pubspec.lock | head -n1)"
          if [[ -n "$host" ]]; then
            echo "PUB_HOSTED_URL=$host" >> "$GITHUB_ENV"
            echo "Using the pub host from pubspec.lock: $host"
          else
            echo "Using the default pub host (pub.dev)"
          fi

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build the Linux release bundle
        run: flutter build linux --release

      - name: Stage the tarball
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.validate.outputs.tag }}'
          mkdir -p dist
          tar -C build/linux/x64/release -czf "dist/ArcadiaPlus-${tag}-linux-x64.tar.gz" bundle

      - name: Build the Debian package
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.validate.outputs.tag }}'
          version='${{ needs.validate.outputs.version }}'
          pkg="$(mktemp -d)/arcadiaplus"
          install -d "$pkg/DEBIAN" "$pkg/usr/lib/arcadiaplus" "$pkg/usr/bin" \
                     "$pkg/usr/share/applications" "$pkg/usr/share/icons/hicolor/512x512/apps"
          cp -a build/linux/x64/release/bundle/. "$pkg/usr/lib/arcadiaplus/"
          ln -s /usr/lib/arcadiaplus/arcadiaplus "$pkg/usr/bin/arcadiaplus"
          cp assets/arcadiaplus.png "$pkg/usr/share/icons/hicolor/512x512/apps/arcadiaplus.png"
          cat > "$pkg/usr/share/applications/arcadiaplus.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=ArcadiaPlus
          Comment=Cross-platform proxy client built with Flutter and Rust
          Exec=arcadiaplus
          Icon=arcadiaplus
          Terminal=false
          Type=Application
          Categories=Network;Utility;
          DESKTOP
          cat > "$pkg/DEBIAN/control" <<CONTROL
          Package: arcadiaplus
          Version: $version
          Architecture: amd64
          Section: net
          Priority: optional
          Maintainer: blueokanna <blueokanna@gmail.com>
          Homepage: https://github.com/blueokanna/ArcadiaPlus
          Depends: libgtk-3-0
          Description: Cross-platform proxy client built with Flutter and Rust
           ArcadiaPlus ships no servers, nodes, or subscriptions; you supply your
           own configuration and are responsible for lawful use.
          CONTROL
          dpkg-deb --build --root-owner-group "$pkg" "dist/ArcadiaPlus-${tag}-linux-x64.deb"
          dpkg-deb --info "dist/ArcadiaPlus-${tag}-linux-x64.deb"

      - name: Upload the Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  ohos:
    name: HarmonyOS release HAP
    needs: [validate, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5

      - name: Check out the proxy engine the bridge points at
        uses: ./.github/actions/checkout-engine

      - name: Reclaim disk space this build does not need
        run: |
          set -euo pipefail
          echo "free before: $(df -h / | awk 'NR==2 {print $4}')"
          # See ci.yml: the HarmonyOS toolchain adds ~6 GB on top of the runner
          # image, and the preinstalled NDK releases are dead weight.
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/android/sdk/ndk
          echo "free after:  $(df -h / | awk 'NR==2 {print $4}')"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'

      - name: Restore the HarmonyOS toolchain downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ohos-downloads
          key: ohos-downloads-v1-${{ runner.os }}-clt5.1.0.840-sdk50bf4602

      - name: Set up the HarmonyOS toolchain
        uses: ./.github/actions/setup-ohos

      - name: Check out the Flutter OHOS SDK
        uses: ./.github/actions/checkout-flutter-ohos

      - name: Prepare the OHOS build
        uses: ./.github/actions/prepare-ohos-build

      - name: Decode the HarmonyOS signing material
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ARCADIAPLUS_OHOS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ARCADIAPLUS_OHOS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARCADIAPLUS_OHOS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ARCADIAPLUS_OHOS_KEY_PASSWORD }}
          CERT_BASE64: ${{ secrets.ARCADIAPLUS_OHOS_CERT_BASE64 }}
          PROFILE_BASE64: ${{ secrets.ARCADIAPLUS_OHOS_PROFILE_BASE64 }}
          SIGN_ALG: ${{ secrets.ARCADIAPLUS_OHOS_SIGN_ALG }}
        run: |
          set -euo pipefail

          required=(KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_BASE64 PROFILE_BASE64)
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::warning title=Unsigned release HAP::the ARCADIAPLUS_OHOS_* secrets are not all configured (missing: ${missing[*]}), so this HAP is unsigned and must be signed before a device accepts it."
            echo "HAP_NAME_SUFFIX=unsigned" >> "$GITHUB_ENV"
            exit 0
          fi

          sign_alg="${SIGN_ALG:-SHA256withECDSA}"
          case "$sign_alg" in
            SHA256withECDSA|SHA256withRSA) ;;
            *)
              echo "::error title=Unsupported signAlg::ARCADIAPLUS_OHOS_SIGN_ALG must be SHA256withECDSA (default) or SHA256withRSA, not '$sign_alg'"
              exit 1
              ;;
          esac

          if [[ "$KEYSTORE_PASSWORD$KEY_PASSWORD$KEY_ALIAS" == *\\* ]]; then
            echo "::error title=Unsupported secret::the HarmonyOS passwords and alias must not contain backslashes"
            exit 1
          fi
          if [[ "$KEYSTORE_PASSWORD$KEY_PASSWORD$KEY_ALIAS" == *'"'* ]]; then
            echo "::error title=Unsupported secret::the HarmonyOS passwords and alias must not contain double quotes"
            exit 1
          fi

          # DevEco expects the three material files next to the project; they
          # are written per run from secrets and never committed.
          mkdir -p ohos/signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > ohos/signing/app.p12
          printf '%s' "$CERT_BASE64" | base64 --decode > ohos/signing/app.cer
          printf '%s' "$PROFILE_BASE64" | base64 --decode > ohos/signing/app.p7b

          python3 - "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" "$sign_alg" <<'PY'
          import re
          import sys

          store_password, key_password, key_alias, sign_alg = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          path = "ohos/build-profile.json5"
          text = open(path, encoding="utf-8").read()
          material = (
              "[\n"
              "      {\n"
              '        "name": "default",\n'
              '        "type": "HarmonyOS",\n'
              '        "material": {\n'
              '          "certpath": "./signing/app.cer",\n'
              f'          "storePassword": "{store_password}",\n'
              f'          "keyAlias": "{key_alias}",\n'
              f'          "keyPassword": "{key_password}",\n'
              '          "profile": "./signing/app.p7b",\n'
              f'          "signAlg": "{sign_alg}",\n'
              '          "storeFile": "./signing/app.p12"\n'
              "        }\n"
              "      }\n"
              "    ]"
          )
          updated, hits = re.subn(
              r'"signingConfigs"\s*:\s*\[\s*\]',
              '"signingConfigs": ' + material,
              text,
              count=1,
          )
          if hits != 1:
              raise SystemExit(
                  "ohos/build-profile.json5 no longer holds an empty signingConfigs "
                  "list -- DevEco Studio writes absolute paths and plain-text passwords "
                  "into it when signing is configured. Run "
                  "'git restore ohos/build-profile.json5' and commit the empty list "
                  "before tagging."
              )
          open(path, "w", encoding="utf-8").write(updated)
          PY
          grep -n 'signingConfigs' ohos/build-profile.json5

          echo "HAP_NAME_SUFFIX=signed" >> "$GITHUB_ENV"

      - name: Build the Rust engine for HarmonyOS arm64
        run: bash ohos/scripts/build-rust-ohos.sh

      - name: Build the release HAP
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${HAP_NAME_SUFFIX:-unsigned}" == "signed" ]]; then
            flutter build hap --release
          else
            flutter build hap --release --no-codesign
          fi

      - name: Verify and stage the HAP
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          hap="$(find ohos/entry/build -name '*.hap' -print -quit)"
          if [[ -z "$hap" ]]; then
            echo "::error title=No HAP produced::flutter build hap left no HAP behind"
            find ohos/entry/build -name '*.hap' -print
            exit 1
          fi
          echo "HAP: $hap ($(du -h "$hap" | cut -f1))"

          # The HAP is only useful if it actually carries the Flutter runtime and
          # the Rust engine; an empty shell would otherwise sail through the
          # upload unnoticed.
          listing="$(unzip -l "$hap")"
          for required in \
            libs/arm64-v8a/libapp.so \
            libs/arm64-v8a/librust_lib_arcadiaplus.so \
            libs/arm64-v8a/libarcadia_core.so; do
            if ! grep -qF "$required" <<< "$listing"; then
              echo "::error title=Incomplete HAP::$required is not packaged in $hap"
              printf '%s\n' "$listing" | head -n 60
              exit 1
            fi
            echo "packaged: $required"
          done

          mkdir -p dist
          cp "$hap" "dist/ArcadiaPlus-${TAG}-ohos-arm64-${HAP_NAME_SUFFIX:-unsigned}.hap"
          ls -lh dist

      - name: Upload the HarmonyOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ohos
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the stable release
    needs: [validate, android, windows, macos, linux, ohos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download every staged asset
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Download the release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Verify the staged assets
        id: release
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            "ArcadiaPlus-${TAG}-android-debug.apk"
            "ArcadiaPlus-${TAG}-android-release.apk"
            "ArcadiaPlus-${TAG}-windows-x64-portable.zip"
            "ArcadiaPlus-${TAG}-windows-x64-setup.exe"
            "ArcadiaPlus-${TAG}-macos-universal.dmg"
            "ArcadiaPlus-${TAG}-macos-universal.zip"
            "ArcadiaPlus-${TAG}-linux-x64.deb"
            "ArcadiaPlus-${TAG}-linux-x64.tar.gz"
          )
          for asset in "${expected[@]}"; do
            if [[ ! -f "dist/$asset" ]]; then
              echo "Missing release asset: $asset" >&2
              exit 1
            fi
          done
          # The HAP is signed or unsigned depending on whether the signing
          # secrets are configured, so it is verified by pattern rather than by
          # exact name.
          if [[ -z "$(find dist -maxdepth 1 -name "ArcadiaPlus-${TAG}-ohos-arm64-*.hap" -print -quit)" ]]; then
            echo "Missing release asset: ArcadiaPlus-${TAG}-ohos-arm64-{signed,unsigned}.hap" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create the update manifest and checksums
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          asset() {
            local platform="$1" name="$2"
            jq -e -n \
              --arg platform "$platform" \
              --arg name "$name" \
              --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${name}" \
              --arg sha256 "$(sha256sum "dist/$name" | cut -d' ' -f1)" \
              '{platform:$platform,name:$name,url:$url,sha256:$sha256}'
          }
          jq -e -n \
            --arg tag "$TAG" \
            --arg version "$VERSION" \
            --arg published_at "$published_at" \
            --argjson android "$(asset android "ArcadiaPlus-${TAG}-android-release.apk")" \
            --argjson windows "$(asset windows "ArcadiaPlus-${TAG}-windows-x64-setup.exe")" \
            --argjson macos "$(asset macos "ArcadiaPlus-${TAG}-macos-universal.dmg")" \
            --argjson linux "$(asset linux "ArcadiaPlus-${TAG}-linux-x64.deb")" \
            '{schema:1,tag:$tag,version:$version,published_at:$published_at,assets:[$android,$windows,$macos,$linux]}' \
            > dist/update-manifest.json
          (cd dist && sha256sum ArcadiaPlus-* update-manifest.json > SHA256SUMS)
          cat dist/update-manifest.json

      - name: Publish the stable GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ArcadiaPlus ${{ steps.release.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*
