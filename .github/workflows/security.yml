name: Rust dependency security

on:
  push:
    paths: ['rust/Cargo.toml', 'rust/Cargo.lock', '.github/workflows/security.yml']
  pull_request:
    paths: ['rust/Cargo.toml', 'rust/Cargo.lock', '.github/workflows/security.yml']
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
      - name: Cache the standalone scanner
        id: scanner-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-rust-1.97.0-v0.22.2
      - name: Install the pinned RustSec scanner
        if: steps.scanner-cache.outputs.cache-hit != 'true'
        run: cargo +1.97.0 install cargo-audit --version 0.22.2 --locked
      - name: Audit every target in the committed lockfile
        # Lockfile auditing does not build the application or need sibling sources.
        run: cargo +1.97.0 audit --file rust/Cargo.lock --deny warnings
