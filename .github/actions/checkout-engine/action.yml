name: Check out the proxy engine
description: >-
  Uses the registry release resolved by Cargo.lock unless rust/Cargo.toml
  explicitly requests the sibling Corduit path. For source builds, checks out
  the matching version and validates the engine manifest.

# Registry builds use Cargo.lock. The optional path-dependency branch supports
# coordinated engine development without retaining a vendor copy in this repo.

runs:
  using: composite
  steps:
    - name: Fetch the engine at the version the bridge requires
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail

        manifest="rust/Cargo.toml"
        # Registry releases are verified through Cargo.lock; do not fetch an
        # unrelated source checkout or require a matching remote Git tag.
        if ! grep -Eq '^corduit[[:space:]]*=.*path[[:space:]]*=' "$manifest"; then
          echo "Corduit is resolved by Cargo.lock; no sibling checkout needed."
          exit 0
        fi
        # The requirement may appear before or after the `path` key, so match it
        # anywhere inside the inline table instead of immediately after `{`.
        requirement="$(sed -nE 's/^corduit[[:space:]]*=[[:space:]]*\{[^}]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$manifest" | head -n1)"
        if [[ -z "${requirement:-}" ]]; then
          echo "::error file=$manifest::No readable 'corduit = { version = \"...\", ... }' requirement; this action cannot infer which engine revision to use."
          exit 1
        fi

        engine="$(cd "${GITHUB_WORKSPACE}/.." && pwd)/Corduit"
        url="https://github.com/blueokanna/Corduit.git"
        echo "Engine requirement: $requirement"
        echo "Engine target:      $engine"

        if [[ -e "$engine" || -L "$engine" ]]; then
          echo "::error title=Existing engine checkout::Refusing to delete $engine. Use a clean runner workspace."
          exit 1
        fi

        # Prefer the release tag so the engine revision is pinned by name rather
        # than by whatever the default branch happens to be at build time.
        if git ls-remote --exit-code --tags "$url" "refs/tags/v${requirement}" >/dev/null 2>&1; then
          ref="v${requirement}"
          echo "Pinned to tag $ref."
        else
          ref="$(git ls-remote --symref "$url" HEAD | sed -nE 's|^ref: refs/heads/([^[:space:]]+)[[:space:]]+HEAD$|\1|p')"
          ref="${ref:-main}"
          echo "::warning title=Unpinned engine::Corduit has no v${requirement} tag, so this build follows branch '${ref}'. Tag the engine release to pin CI to an immutable revision."
        fi

        git clone --depth 1 --branch "$ref" "$url" "$engine"

        # A checkout that silently reports a different version would surface as
        # an unexplained resolution failure, so check it here and name the
        # mismatch instead.
        actual="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$engine/Cargo.toml" | head -n1)"
        if [[ "$actual" != "$requirement" ]]; then
          echo "::error title=Engine version mismatch::rust/Cargo.toml requires corduit ${requirement} but '${ref}' reports ${actual}. Bump the requirement and the engine together."
          exit 1
        fi

        echo "Engine $actual ready at $engine"
