name: Prepare the OHOS build
description: >-
  Points pub at the host recorded in pubspec.lock, checks that the checked-in
  HarmonyOS product versions still match what the pinned fork template ships
  for the provisioned SDK (an M.S.F(api) compatibleSdkVersion and no
  targetSdkVersion), widens the pubspec SDK bounds to the Flutter OHOS fork's
  Dart line, and resolves dependencies. Shared by the CI and release HAP jobs
  so both build under identical rules.

# Why the pubspec bounds are rewritten
# ------------------------------------
# `environment.sdk`/`environment.flutter` describe the stable Flutter line this
# repository develops against (3.47.x). The only toolchain that can build a HAP
# is the Flutter OHOS fork, whose releases trail upstream, so its Dart SDK is
# older than what those bounds allow. The rewrite happens in the runner's
# working tree, is printed with `git diff`, and is never committed.

inputs:
  flutter-command:
    description: Flutter entry point to inspect (allows an absolute path in tests).
    required: false
    default: flutter

runs:
  using: composite
  steps:
    - name: Use the pub host recorded in pubspec.lock
      shell: bash
      run: |
        set -euo pipefail
        # `pubspec.lock` records the host that produced it; resolving against a
        # different host makes `--enforce-lockfile` report every package as
        # changed. Follow the lockfile instead of hard-coding a mirror.
        host="$(sed -nE 's|^ *url: *"(https?://[^"]+)"$|\1|p' pubspec.lock | head -n1)"
        if [[ -n "$host" ]]; then
          echo "PUB_HOSTED_URL=$host" >> "$GITHUB_ENV"
          echo "Using the pub host from pubspec.lock: $host"
        else
          echo "Using the default pub host (pub.dev)"
        fi

    - name: Check the product SDK versions and widen the fork's Dart line
      shell: bash
      env:
        FLUTTER_COMMAND: ${{ inputs.flutter-command }}
      run: |
        set -euo pipefail

        # hvigor validates the product versions before the first build task,
        # and two aborts bracket the only accepted shape:
        # - the SDK Manager under $DEVECO_SDK_HOME resolves
        #   compatibleSdkVersion, so a value the provisioned SDK does not
        #   register dies with `00303082 Unable to find the
        #   compatibleSdkVersion ... in SDK Manager` -- values derived from
        #   the SDK's component manifests name the OHOS build line
        #   (`26.0.0`, apiVersion 26), which is not what the manager resolves;
        # - in HarmonyOS mode hvigor 5.18 accepts only the `M.S.F(api)`
        #   spelling for compile/compatible/target SDK versions, so a bare
        #   `M.S.F` dies with `00306042 Specification Limit Violation` in
        #   ~1.4 s -- the `26.0.0` a previous revision pinned here failed
        #   CI exactly that way.
        # The profile therefore carries exactly what the pinned fork template
        # (CPF-Flutter/flutter_flutter) ships for the SDK this workflow
        # provisions -- `"compatibleSdkVersion": "5.1.0(18)"` and no
        # targetSdkVersion at all -- and this build refuses to proceed if
        # either fact has drifted.
        if ! grep -qF '"compatibleSdkVersion": "5.1.0(18)"' ohos/build-profile.json5; then
          echo "::error title=OHOS compatibleSdkVersion drifted::ohos/build-profile.json5 no longer carries \"compatibleSdkVersion\": \"5.1.0(18)\" -- the value the pinned Flutter OHOS fork template ships for the SDK this workflow provisions; hvigor fails with 00303082 or 00306042 for the alternatives"
          grep -nE '"compatibleSdkVersion"|"targetSdkVersion"' ohos/build-profile.json5 || true
          exit 1
        fi
        if grep -qF '"targetSdkVersion"' ohos/build-profile.json5; then
          echo "::error title=OHOS targetSdkVersion reappeared::ohos/build-profile.json5 sets targetSdkVersion again -- the pinned fork template omits it, and in HarmonyOS mode hvigor 5.18 only accepts the M.S.F(api) spelling here (a bare M.S.F dies with 00306042)"
          grep -nE '"compatibleSdkVersion"|"targetSdkVersion"' ohos/build-profile.json5 || true
          exit 1
        fi
        grep -nE '"compatibleSdkVersion"|"targetSdkVersion"' ohos/build-profile.json5 || true

        # A freshly checked out Flutter OHOS fork bootstraps on its first run:
        # it builds flutter_tools and downloads the Dart SDK, and that progress
        # output shares stdout with the command being captured. When it lands
        # inside `--version --machine` the capture starts with a progress line
        # instead of JSON and jq dies with "Invalid numeric literal". Warm the
        # tool up once with the output discarded, and keep only the JSON object
        # from the first line that starts with `{` in case anything still
        # bleeds into the capture.
        "$FLUTTER_COMMAND" --version > /dev/null 2>&1 || true
        info="$("$FLUTTER_COMMAND" --version --machine)"
        info="$(sed -n '/^{/,$p' <<< "$info")"
        dart="$(jq -r '.dartSdkVersion' <<< "$info")"
        framework="$(jq -r '.frameworkVersion' <<< "$info")"
        if [[ -z "$dart" || -z "$framework" ]]; then
          echo "::error title=Unreadable Flutter version::flutter --version --machine did not report dartSdkVersion/frameworkVersion"
          printf '%s\n' "$info"
          exit 1
        fi
        echo "Flutter OHOS fork reports Flutter $framework / Dart $dart"

        python3 - "$dart" "$framework" <<'PY'
        import re
        import sys

        dart, framework = sys.argv[1], sys.argv[2]
        path = "pubspec.yaml"
        text = open(path, encoding="utf-8").read()
        text, sdk_hits = re.subn(
            r"^  sdk:.*$",
            f"  sdk: '>={dart} <4.0.0'",
            text,
            count=1,
            flags=re.M,
        )
        text, flutter_hits = re.subn(
            r"^  flutter: '[^']*'.*$",
            f"  flutter: '>={framework}'",
            text,
            count=1,
            flags=re.M,
        )
        if sdk_hits != 1 or flutter_hits != 1:
            raise SystemExit(
                f"pubspec.yaml did not look as expected (sdk={sdk_hits}, flutter={flutter_hits})"
            )
        open(path, "w", encoding="utf-8").write(text)
        PY
        git --no-pager diff -- pubspec.yaml

    - name: Resolve dependencies for the OHOS SDK line
      shell: bash
      env:
        FLUTTER_COMMAND: ${{ inputs.flutter-command }}
      run: |
        set -euo pipefail
        # Deliberately without --enforce-lockfile: pubspec.lock is produced by
        # the 3.47.x stable SDK and pins packages whose SDK constraints the
        # fork's older Dart cannot satisfy. pub re-resolves in the working tree
        # only; nothing here is committed.
        "$FLUTTER_COMMAND" pub get

    - name: Warm and patch the OHOS embedding har
      shell: bash
      env:
        FLUTTER_COMMAND: ${{ inputs.flutter-command }}
      run: |
        set -euo pipefail

        # The engine artifacts carry `flutter.har`, the ohos embedding the HAP
        # compiles against. Materialize them before the patch below: the cache
        # stamps by version and never re-reads contents, so the archives
        # patched here are the ones the later build consumes instead of
        # re-downloading.
        "$FLUTTER_COMMAND" precache --ohos --ohos_internal_build

        # The har's `KeyEventHandler.ets` gates CapsLock/NumLock on the
        # `KeyEvent` properties `isCapsLockOn`/`isNumLockOn`, which the pinned
        # SDK (5.1.0 / API 18) does not declare -- it has the older
        # `capsLock`/`numLock` booleans -- and ArkTS fails the file at compile
        # time, so the `!== undefined` guards never run. The patch rewrites
        # both expressions to the constants those guards produce, which is the
        # code's own stated behaviour on a SDK without the properties; without
        # it CompileArkTS fails the whole HAP build.
        cache="$FLUTTER_OHOS_ROOT/bin/cache/artifacts/engine"
        if [[ ! -d "$cache" ]]; then
          echo "::error title=OHOS engine cache missing::$cache does not exist after precache; the embedding har cannot be patched"
          exit 1
        fi
        python3 ohos/scripts/patch-flutter-ohos-har.py "$cache"
