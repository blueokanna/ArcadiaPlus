name: Check out the Flutter OHOS SDK
description: >-
  Clones the pinned CPF-Flutter `flutter_flutter` fork — the only Flutter SDK
  that can build a HAP — and puts its `bin` on PATH. The version is an input so
  the SDK line is visible in every workflow that uses it.

# Why a mirror instead of the official SDK
# -----------------------------------------
# The HAP target lives in the OpenHarmony-adapted fork maintained by the
# CPF-Flutter organisation (gitcode.com/CPF-Flutter/flutter_flutter); upstream
# Flutter has no ohos tool chain. Releases follow
# `3.41.10-ohos-X.Y.Z` (built on upstream Flutter 3.41.9) and the fork pulls its
# Dart SDK and engine artifacts from its own OBS mirror by default, so no
# storage environment variables are needed here.

inputs:
  version:
    description: >-
      Release tag of gitcode.com/CPF-Flutter/flutter_flutter to check out.
      Keep this in one place: the app's `environment.sdk`/`environment.flutter`
      constraints are tightened against the Dart/Framework version this tag
      reports, and the workflows derive those bounds from the checked-out SDK.
    required: false
    default: 3.41.10-ohos-1.0.0

runs:
  using: composite
  steps:
    - name: Clone the Flutter OHOS SDK
      shell: bash
      env:
        FLUTTER_OHOS_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        root="$RUNNER_TEMP/flutter-ohos"
        url="https://gitcode.com/CPF-Flutter/flutter_flutter.git"

        rm -rf "$root"
        for attempt in 1 2 3; do
          echo "Cloning $url at $FLUTTER_OHOS_VERSION (attempt $attempt)"
          if git clone --depth 1 --single-branch --branch "$FLUTTER_OHOS_VERSION" "$url" "$root"; then
            break
          fi
          rm -rf "$root"
          sleep 15
        done

        if [[ ! -d "$root/packages/flutter_tools" ]]; then
          echo "::error title=Flutter OHOS checkout failed::could not clone tag $FLUTTER_OHOS_VERSION from $url"
          exit 1
        fi

        # The fork's wrapper refuses to run from a repository git does not
        # trust (it calls `git rev-parse HEAD` during bootstrap).
        git config --global --add safe.directory "$root"

        echo "$root/bin" >> "$GITHUB_PATH"
        echo "FLUTTER_OHOS_ROOT=$root" >> "$GITHUB_ENV"
        echo "Using the Flutter OHOS SDK at $root"
