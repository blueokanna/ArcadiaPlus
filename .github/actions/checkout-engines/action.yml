name: Check out pinned sibling engines
description: Fetch commits recorded in scripts/engine_revisions.json into sibling repositories.
runs:
  using: composite
  steps:
    - name: Prepare Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Fetch pinned sources
      shell: bash
      working-directory: ${{ github.workspace }}
      run: python scripts/checkout_engines.py
