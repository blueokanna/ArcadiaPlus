name: Set up the HarmonyOS toolchain
description: >-
  Provisions the HarmonyOS command-line tools (hvigor, ohpm, node and the
  complete HarmonyOS 5.1.0 SDK the archive bundles), then exports
  DEVECO_SDK_HOME, TOOL_HOME and OHOS_NDK.

inputs:
  commandline-tools-url:
    description: URL of the HarmonyOS command-line tools archive for linux-x64.
    required: false
    default: https://repo.huaweicloud.com/harmonyos/ohpm/5.1.0/commandline-tools-linux-x64-5.1.0.840.zip

runs:
  using: composite
  steps:
    - name: Resolve the toolchain cache key from the published digest
      id: toolchain_key
      shell: bash
      env:
        CLT_URL: ${{ inputs.commandline-tools-url }}
      run: |
        set -euo pipefail

        # The command-line tools' digest is published next to the archive.
        # Fetching the 64-character `.sha256` (not the 2 GB archive) is what
        # makes the cache key content-addressed: an upstream re-roll under
        # the same version misses the cache and downloads once, instead of
        # being judged stale on every run while the stale entry shadows the
        # save.
        if ! clt_sha="$(curl --fail --location --silent --show-error \
                              --retry 5 --retry-delay 5 --retry-all-errors \
                              "$CLT_URL.sha256" | tr -d '[:space:]')"; then
          echo "::error title=Checksum unavailable::could not download $CLT_URL.sha256"
          exit 1
        fi
        if [[ ! "$clt_sha" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error title=Checksum unreadable::the published .sha256 file does not contain a SHA-256 digest"
          echo "$clt_sha"
          exit 1
        fi

        echo "expected-clt-sha=$clt_sha" >> "$GITHUB_OUTPUT"
        echo "cache-key=ohos-clt-${{ runner.os }}-clt-${clt_sha:0:16}" >> "$GITHUB_OUTPUT"
        echo "toolchain digest: clt=$clt_sha"

    - name: Restore the cached toolchain archive
      id: toolchain_archives
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/ohos-downloads
        key: ${{ steps.toolchain_key.outputs.cache-key }}
        # The other prefixes are the transition: the previous generation's
        # entries contain the very same command-line tools archive (plus the
        # retired OpenHarmony SDK payload, which the download step sheds),
        # and `ohos-downloads-v1` matches the key the workflows used before
        # the cache moved into this action, so neither costs a 2.2 GB
        # re-download.
        restore-keys: |
          ohos-clt-${{ runner.os }}-
          ohos-toolchain-archives-${{ runner.os }}-
          ohos-downloads-v1-${{ runner.os }}-

    - name: Download the HarmonyOS command-line tools
      id: download
      shell: bash
      env:
        CLT_URL: ${{ inputs.commandline-tools-url }}
        EXPECTED_CLT_SHA: ${{ steps.toolchain_key.outputs.expected-clt-sha }}
      run: |
        set -euo pipefail

        downloads="$RUNNER_TEMP/ohos-downloads"
        mkdir -p "$downloads"
        clt_archive="$downloads/$(basename "$CLT_URL")"

        # A restored entry from the previous generation also carries the
        # retired OpenHarmony SDK payload; shed it so a later save keeps the
        # cache to the one archive this action needs.
        rm -f "$downloads"/sdk_openharmony*

        # `--retry-all-errors` also covers the connection resets that a 2 GiB
        # cross-border download from a shared runner does hit; `--continue-at -`
        # resumes an interrupted transfer instead of restarting it.
        fetch() {
          local url="$1" destination="$2"
          curl --fail --location --silent --show-error \
               --retry 5 --retry-delay 5 --retry-all-errors \
               --continue-at - --output "$destination" "$url"
        }

        clt_sha="$(sha256sum "$clt_archive" 2>/dev/null | cut -d' ' -f1 || true)"
        if [[ "$clt_sha" != "$EXPECTED_CLT_SHA" ]]; then
          echo "Command-line tools archive missing or stale; downloading $CLT_URL"
          rm -f "$clt_archive"
          fetch "$CLT_URL" "$clt_archive"
          clt_sha="$(sha256sum "$clt_archive" | cut -d' ' -f1)"
        fi
        if [[ "$clt_sha" != "$EXPECTED_CLT_SHA" ]]; then
          echo "::error title=Corrupt command-line tools::sha256 mismatch: expected $EXPECTED_CLT_SHA, got $clt_sha"
          exit 1
        fi
        echo "command-line tools verified: $clt_sha"

        echo "verified=true" >> "$GITHUB_OUTPUT"
        echo "CLT_ARCHIVE=$clt_archive" >> "$GITHUB_ENV"

    - name: Save the toolchain archive to the cache
      # Saved the moment the digest verifies, not at the end of the job: a
      # build that fails, or a run that is cancelled an hour later, keeps
      # the entry this way. Skipped on a hit; a save that loses a race with
      # a parallel job on the same key warns without failing a build whose
      # archive just verified.
      if: steps.toolchain_archives.outputs.cache-hit != 'true' && steps.download.outputs.verified == 'true'
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/ohos-downloads
        key: ${{ steps.toolchain_key.outputs.cache-key }}

    - name: Unpack the command-line tools with their bundled SDK
      shell: bash
      run: |
        set -euo pipefail

        tools_root="$RUNNER_TEMP/ohos-clt"
        rm -rf "$tools_root"
        mkdir -p "$tools_root"
        unzip -q "$CLT_ARCHIVE" -d "$tools_root"

        # The archive unpacks into a single top-level directory; the layout is
        # `command-line-tools/{bin,hvigor,ohpm,sdk,tool}`, with the complete
        # HarmonyOS 5.1.0 SDK under `sdk/default/{openharmony,hms}`.
        tool_home="$(find "$tools_root" -maxdepth 1 -mindepth 1 -type d -name 'command-line-tools' -print -quit)"
        if [[ -z "$tool_home" ]]; then
          echo "::error title=Unexpected command-line tools layout::no command-line-tools directory in the archive"
          find "$tools_root" -maxdepth 2 | head -n 40
          exit 1
        fi

        # The SDK halves are checked by name: `restool` is what
        # `CompileResource` runs, and the hms transcoder library is what it
        # dlopens, so a layout that lost either fails the build with
        # `11201001 Dependency Error` instead of a layout error.
        for required in hvigor/bin/hvigorw ohpm/bin/ohpm tool/node/bin/node \
                        sdk/default/sdk-pkg.json \
                        sdk/default/openharmony/toolchains/restool \
                        sdk/default/hms/toolchains/lib/libimage_transcoder_shared.so; do
          if [[ ! -e "$tool_home/$required" ]]; then
            echo "::error title=Unexpected command-line tools layout::$required is missing from the archive"
            exit 1
          fi
        done

        chmod -R u+rwX "$tool_home"
        # The zips are built on Linux and normally carry their modes, but a
        # silently dropped executable bit would only surface as a confusing
        # "permission denied" much later, so restore it explicitly.
        find "$tool_home" -type f \
          \( -path '*/bin/*' -o -path '*/toolchains/*' \
             -o -path '*/native/llvm/bin/*' -o -path '*/native/build-tools/*' \) \
          -exec chmod +x {} \;

        # Unpacked, and the cache entry is the durable copy: the ~2 GB
        # archive would otherwise sit on the runner with no reader left.
        rm -f "$CLT_ARCHIVE"

        echo "TOOL_HOME=$tool_home" >> "$GITHUB_ENV"
        echo "TOOL_HOME=$tool_home"
        echo "DEVECO_SDK_HOME=$tool_home/sdk" >> "$GITHUB_ENV"
        echo "OHOS_NDK=$tool_home/sdk/default/openharmony/native" >> "$GITHUB_ENV"

    - name: Describe the installed SDK
      shell: bash
      run: |
        set -euo pipefail

        sdk_pkg="$TOOL_HOME/sdk/default/sdk-pkg.json"
        if [[ ! -f "$sdk_pkg" ]]; then
          echo "::error title=Missing SDK metadata::$sdk_pkg does not exist; flutter_tools discovers the HarmonyOS SDK through it"
          find "${DEVECO_SDK_HOME:-$TOOL_HOME/sdk}" -maxdepth 3 | head -n 60 || true
          exit 1
        fi
        echo '--- sdk-pkg.json ---'
        cat "$sdk_pkg"
        echo

        # The product versions the project builds with are *not* derived from
        # this metadata or any other file here: hvigor resolves
        # compatibleSdkVersion against the SDK Manager under
        # $DEVECO_SDK_HOME, and the SDK's manifests name its build line
        # (`5.1.0.125`) rather than the `M.S.F(api)` value the manager
        # accepts -- deriving from them once produced `26.0.0(26)` from the
        # retired OpenHarmony test overlay and the HAP build died in 2.9 s
        # with 00303082 ("Unable to find the compatibleSdkVersion ... in SDK
        # Manager"). ohos/build-profile.json5 carries the `M.S.F(api)`
        # compatibleSdkVersion the pinned fork template ships for this SDK
        # (5.1.0(18)) and no targetSdkVersion -- hvigor 5.18 rejects the
        # bare `M.S.F` spelling in HarmonyOS mode with 00306042 -- and
        # .github/actions/prepare-ohos-build refuses to build if either
        # fact drifts.

        echo '--- toolchain versions ---'
        node --version
        java -version
        "$TOOL_HOME/ohpm/bin/ohpm" --version || true
        hvigorw --version --no-daemon || true

        echo '--- PATH additions ---'
        for entry in \
          "$TOOL_HOME/sdk/default/openharmony/toolchains" \
          "$TOOL_HOME/ohpm/bin" \
          "$TOOL_HOME/hvigor/bin" \
          "$TOOL_HOME/tool/node/bin" \
          "$TOOL_HOME/sdk/default/openharmony/native/llvm/bin"; do
          echo "  $entry"
        done

    - name: Expose the toolchain on PATH
      shell: bash
      run: |
        set -euo pipefail
        # Same ordering as Huawei's .ci_ohos.yaml: the SDK's own toolchains
        # first, then ohpm, hvigor and the bundled node.
        {
          echo "$TOOL_HOME/sdk/default/openharmony/toolchains"
          echo "$TOOL_HOME/ohpm/bin"
          echo "$TOOL_HOME/hvigor/bin"
          echo "$TOOL_HOME/tool/node/bin"
          echo "$TOOL_HOME/sdk/default/openharmony/native/llvm/bin"
        } >> "$GITHUB_PATH"

    - name: Point npm at registries the hvigor plugin tree is published to
      shell: bash
      run: |
        set -euo pipefail
        # `flutter build hap` installs the flutter-hvigor-plugin and its
        # @ohos/* hvigor dependencies with npm; the @ohos scope only exists on
        # Huawei's registry.
        {
          printf '%s\n' \
            'registry=https://repo.huaweicloud.com/repository/npm/' \
            '@ohos:registry=https://repo.harmonyos.com/npm/' \
            'fetch-retries=5' \
            'fetch-retry-mintimeout=20000' \
            'fetch-retry-maxtimeout=120000'
        } >> "$HOME/.npmrc"
        cat "$HOME/.npmrc"
