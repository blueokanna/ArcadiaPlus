# Keep local builds, cargokit, rustfmt and CI Clippy on one toolchain.
# Rust 1.95 is the minimum supported compiler — corduit 0.4.0 and parking_lot
# 0.13.0 both declare it — and CI checks that floor separately; it does not
# need to be the compiler used to produce release artifacts.

[toolchain]
channel = "1.97.0"
components = ["clippy", "rustfmt", "rust-analyzer"]
targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "i686-linux-android",
    "x86_64-linux-android",
]
