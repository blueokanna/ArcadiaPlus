# Keep local builds, cargokit, rustfmt and CI Clippy on one toolchain.
# Rust 1.88 is the minimum supported compiler and is checked separately in CI;
# it does not need to be the compiler used to produce release artifacts.

[toolchain]
channel = "1.97.0"
components = ["clippy", "rustfmt", "rust-analyzer"]
targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "i686-linux-android",
    "x86_64-linux-android",
]
